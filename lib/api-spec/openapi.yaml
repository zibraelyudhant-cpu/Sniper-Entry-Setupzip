                        openapi: 3.1.0
                        info:
                          # Do not change the title, if the title changes, the import paths will be broken
                          title: Api
                          version: 0.2.0
                          description: API specification — Crypto Screener Futures (Menu 1-6)
                        servers:
                          - url: /api
                            description: Base API path
                        tags:
                          - name: health
                            description: Health operations
                          - name: screener
                            description: Crypto screener operations
                          - name: breakout-entry
                            description: Menu 1 — Breakout Entry (konsolidasi H4 → breakout + volume → retest)
                          - name: smc-analysis
                            description: Menu 2 — Sniper entry analysis
                          - name: scalping
                            description: Menu 4 — Scalping SMC (M30 → M5)
                          - name: extreme-scalping
                            description: Extreme Scalping (H1 → M15 → M5, fokus reversal via CHoCH)
                          - name: patterns
                            description: Menu 5 — Chart pattern detection
                          - name: backtest
                            description: Menu 6 — Backtest sinyal historis
                        paths:
                          /healthz:
                            get:
                              operationId: healthCheck
                              tags: [health]
                              summary: Health check
                              description: Returns server health status
                              responses:
                                "200":
                                  description: Healthy
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/HealthStatus"

                          /screener:
                            get:
                              operationId: getScreener
                              tags: [screener]
                              summary: Get top crypto futures coins
                              description: Returns top futures coins sorted by volume with bias analysis
                              responses:
                                "200":
                                  description: Screener results
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ScreenerResponse"
                                "500":
                                  description: Server error
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"

                          /breakout-entry:
                            get:
                              operationId: getBreakoutEntry
                              tags: [breakout-entry]
                              summary: Analisa Breakout Entry (Menu 1) untuk 1 symbol
                              parameters:
                                - name: symbol
                                  in: query
                                  required: true
                                  schema:
                                    type: string
                                  description: "Futures symbol e.g. BTCUSDT"
                              responses:
                                "200":
                                  description: Hasil analisa
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/BreakoutTradingResult"
                                "400":
                                  description: Bad request
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"
                                "500":
                                  description: Server error
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"

                          /breakout-entry/scan:
                            get:
                              operationId: getBreakoutEntryScan
                              tags: [breakout-entry]
                              summary: Scan universe top-50 buat Breakout Entry
                              responses:
                                "200":
                                  description: Hasil scan
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/BreakoutTradingScanResponse"
                                "500":
                                  description: Server error
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"

                          /smc-analysis:
                            get:
                              operationId: getSmcAnalysis
                              tags: [smc-analysis]
                              summary: Run SMC sniper entry analysis
                              description: Full top-down SMC analysis for a given symbol
                              parameters:
                                - name: symbol
                                  in: query
                                  required: true
                                  schema:
                                    type: string
                                  description: "Futures symbol e.g. BTCUSDT"
                              responses:
                                "200":
                                  description: Analysis result
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/SniperResult"
                                "400":
                                  description: Bad request
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"
                                "500":
                                  description: Server error
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"

                          /sniper/scan:
                            get:
                              operationId: getSniperScan
                              tags: [smc-analysis]
                              summary: Scan universe top-50 buat Sniper Entry
                              responses:
                                "200":
                                  description: Hasil scan
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/SniperScanResponse"
                                "500":
                                  description: Server error
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"

                          /breakout:
                            get:
                              operationId: getScalping
                              tags: [scalping]
                              summary: Analisa Scalping SMC (Menu 4) untuk 1 symbol
                              description: "Nama path historis '/breakout' dipertahankan (bukan '/scalping') supaya routing lama gak berubah."
                              parameters:
                                - name: symbol
                                  in: query
                                  required: true
                                  schema:
                                    type: string
                                  description: "Futures symbol e.g. BTCUSDT"
                              responses:
                                "200":
                                  description: Hasil analisa
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ScalpingResult"
                                "400":
                                  description: Bad request
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"
                                "500":
                                  description: Server error
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"

                          /breakout/scan:
                            get:
                              operationId: getScalpingScan
                              tags: [scalping]
                              summary: Scan universe top-50 buat Scalping SMC
                              responses:
                                "200":
                                  description: Hasil scan
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ScalpingScanResponse"
                                "500":
                                  description: Server error
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"

                          /extreme-scalping:
                            get:
                              operationId: getExtremeScalping
                              tags: [extreme-scalping]
                              summary: Analisa Extreme Scalping untuk 1 symbol
                              parameters:
                                - name: symbol
                                  in: query
                                  required: true
                                  schema:
                                    type: string
                                  description: "Futures symbol e.g. BTCUSDT"
                              responses:
                                "200":
                                  description: Hasil analisa
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ExtremeScalpingResult"
                                "400":
                                  description: Bad request
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"
                                "500":
                                  description: Server error
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"

                          /extreme-scalping/scan:
                            get:
                              operationId: getExtremeScalpingScan
                              tags: [extreme-scalping]
                              summary: Scan universe top-50 buat Extreme Scalping
                              responses:
                                "200":
                                  description: Hasil scan
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ExtremeScalpingScanResponse"
                                "500":
                                  description: Server error
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"

                          /patterns:
                            get:
                              operationId: getPatterns
                              tags: [patterns]
                              summary: Deteksi chart pattern multi-timeframe (Menu 5)
                              parameters:
                                - name: symbol
                                  in: query
                                  required: true
                                  schema:
                                    type: string
                                  description: "Futures symbol e.g. BTCUSDT"
                              responses:
                                "200":
                                  description: Hasil deteksi pattern
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/PatternsResponse"
                                "400":
                                  description: Bad request
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"
                                "500":
                                  description: Server error
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"

                          /backtest/listing-info:
                            get:
                              operationId: getBacktestListingInfo
                              tags: [backtest]
                              summary: Info umur listing sebuah koin di Binance Futures
                              parameters:
                                - name: symbol
                                  in: query
                                  required: true
                                  schema:
                                    type: string
                              responses:
                                "200":
                                  description: Info listing
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ListingInfo"
                                "400":
                                  description: Bad request
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"
                                "404":
                                  description: Data tidak ditemukan
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"
                                "500":
                                  description: Server error
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"

                          /backtest:
                            post:
                              operationId: postBacktest
                              tags: [backtest]
                              summary: Jalankan backtest sinyal historis (Menu 6)
                              requestBody:
                                required: true
                                content:
                                  application/json:
                                    schema:
                                      $ref: "#/components/schemas/BacktestRequest"
                              responses:
                                "200":
                                  description: Hasil backtest
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/BacktestResult"
                                "400":
                                  description: Bad request
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"
                                "500":
                                  description: Server error
                                  content:
                                    application/json:
                                      schema:
                                        $ref: "#/components/schemas/ErrorResponse"

                        components:
                          schemas:
                            HealthStatus:
                              type: object
                              properties:
                                status:
                                  type: string
                              required:
                                - status

                            ErrorResponse:
                              type: object
                              properties:
                                error:
                                  type: string
                              required:
                                - error

                            ScreenerCoin:
                              type: object
                              properties:
                                symbol:
                                  type: string
                                price:
                                  type: number
                                change24h:
                                  type: number
                                volume24h:
                                  type: number
                                bias:
                                  type: string
                                  enum: [bullish, bearish, ranging]
                                strength:
                                  type: string
                                  enum: [strong, weak, neutral]
                              required:
                                - symbol
                                - price
                                - change24h
                                - volume24h
                                - bias
                                - strength

                            ScreenerResponse:
                              type: object
                              properties:
                                coins:
                                  type: array
                                  items:
                                    $ref: "#/components/schemas/ScreenerCoin"
                                fetchedAt:
                                  type: number
                              required:
                                - coins
                                - fetchedAt

                            TrendInfo:
                              type: object
                              properties:
                                bias:
                                  type: string
                                  enum: [bullish, bearish, ranging]
                                strength:
                                  type: string
                                  enum: [strong, moderate, weak, neutral]
                              required:
                                - bias
                                - strength

                            ZoneRange:
                              type: object
                              properties:
                                low:
                                  type: number
                                high:
                                  type: number
                              required:
                                - low
                                - high

                            # ─── Menu 1 — Breakout Entry ────────────────────────────────────────────
                            DirectionalProbability:
                              type: object
                              properties:
                                bullishPct:
                                  type: number
                                bearishPct:
                                  type: number
                                reasoning:
                                  type: array
                                  items:
                                    type: string
                              required:
                                - bullishPct
                                - bearishPct
                                - reasoning

                            AnticipationEntry:
                              type: object
                              properties:
                                direction:
                                  type: string
                                  enum: [bullish, bearish]
                                entryPrice:
                                  type: number
                                stopLoss:
                                  type: number
                                sizeNote:
                                  type: string
                                trendContext:
                                  type: string
                              required:
                                - direction
                                - entryPrice
                                - stopLoss
                                - sizeNote
                                - trendContext

                            # ─── Mini-Backtest Instan (dipakai di 4 Result — cuma endpoint single-symbol) ──
                            RecentPerformance:
                              type: object
                              properties:
                                totalTrades:
                                  type: number
                                wins:
                                  type: number
                                losses:
                                  type: number
                                winRate:
                                  type: number
                                periodLabel:
                                  type: string
                              required:
                                - totalTrades
                                - wins
                                - losses
                                - winRate
                                - periodLabel

                            TFBreakdownItem:
                              type: object
                              properties:
                                timeframe:
                                  type: string
                                label:
                                  type: string
                                detail:
                                  type: string
                                status:
                                  type: string
                                  enum: [confirm, warning, neutral]
                              required:
                                - timeframe
                                - label
                                - detail
                                - status

                            BreakoutTradingResult:
                              type: object
                              properties:
                                status:
                                  type: string
                                  enum: [ready, waiting, approaching, in_zone, expired, no_setup, skip, error]
                                symbol:
                                  type: string
                                recentPerformance:
                                  $ref: "#/components/schemas/RecentPerformance"
                                bias:
                                  type: string
                                  enum: [bullish, bearish]
                                breakoutType:
                                  type: string
                                  enum: [continuation, reversal]
                                tfBreakdown:
                                  type: array
                                  items:
                                    $ref: "#/components/schemas/TFBreakdownItem"
                                currentPrice:
                                  type: number
                                timestamp:
                                  type: string
                                message:
                                  type: string
                                score:
                                  type: number
                                maxScore:
                                  type: number
                                consolidationHigh:
                                  type: number
                                consolidationLow:
                                  type: number
                                consolidationCandles:
                                  type: number
                                brokenLevel:
                                  type: number
                                entryPrice:
                                  type: number
                                stopLoss:
                                  type: number
                                takeProfit1:
                                  type: number
                                takeProfit2:
                                  type: number
                                rr1:
                                  type: number
                                volumeRatio:
                                  type: number
                                filterResults:
                                  type: array
                                  items:
                                    type: string
                                buyStopPrice:
                                  type: number
                                sellStopPrice:
                                  type: number
                                rangeHeight:
                                  type: number
                                leanBias:
                                  type: string
                                  enum: [bullish, bearish, neutral]
                                directionalProbability:
                                  $ref: "#/components/schemas/DirectionalProbability"
                                anticipationEntry:
                                  $ref: "#/components/schemas/AnticipationEntry"
                              required:
                                - status
                                - symbol
                                - currentPrice
                                - timestamp
                                - maxScore

                            BreakoutTradingScanResponse:
                              type: object
                              properties:
                                coins:
                                  type: array
                                  items:
                                    $ref: "#/components/schemas/BreakoutTradingResult"
                                fetchedAt:
                                  type: number
                              required:
                                - coins
                                - fetchedAt

                            # ─── Menu 2 — Sniper ────────────────────────────────────────────────────
                            SniperResult:
                              type: object
                              properties:
                                status:
                                  type: string
                                  enum: [ready, no_trend, no_zone, skip_conditions, error]
                                recentPerformance:
                                  $ref: "#/components/schemas/RecentPerformance"
                                tfBreakdown:
                                  type: array
                                  items:
                                    $ref: "#/components/schemas/TFBreakdownItem"
                                message:
                                  type: string
                                symbol:
                                  type: string
                                currentPrice:
                                  type: number
                                timestamp:
                                  type: string
                                bias:
                                  type: string
                                  enum: [bullish, bearish]
                                entryPrice:
                                  type: number
                                stopLoss:
                                  type: number
                                takeProfit1:
                                  type: number
                                takeProfit2:
                                  type: number
                                h4:
                                  $ref: "#/components/schemas/TrendInfo"
                                zoneType:
                                  type: string
                                zoneRange:
                                  $ref: "#/components/schemas/ZoneRange"
                                refinedZoneType:
                                  type: string
                                entryConfirmed:
                                  type: boolean
                                confirmationCandle:
                                  type: string
                                rsi:
                                  type: number
                                rsiDivergence:
                                  type: boolean
                                chochDetected:
                                  type: boolean
                                oiChange:
                                  type: number
                                oiAccumulation:
                                  type: boolean
                                oiAccumulationDesc:
                                  type: string
                                fundingRate:
                                  type: number
                                setupValidHours:
                                  type: number
                                estimatedHitHours:
                                  type: number
                                expiryHours:
                                  type: number
                                skipReasons:
                                  type: array
                                  items:
                                    type: string
                                reasoning:
                                  type: string
                                rejection15M:
                                  type: boolean
                                rejection15MCandle:
                                  type: string
                                choch15M:
                                  type: boolean
                                choch15MDescription:
                                  type: string
                                rsiDivergenceH1:
                                  type: boolean
                                patternConfirmed:
                                  type: boolean
                                patternName:
                                  type: string
                                profitProbability:
                                  type: number
                                probabilityFactors:
                                  type: array
                                  items:
                                    type: string
                                dowPhase:
                                  type: string
                                dowPhaseDesc:
                                  type: string
                                volumeTrendValid:
                                  type: boolean
                                volumeTrendDesc:
                                  type: string
                                chochH4Detected:
                                  type: boolean
                                h4ConfluenceConfirmed:
                                  type: boolean
                                h4ConfluenceStrength:
                                  type: string
                                h4ConfluenceDesc:
                                  type: string
                              required:
                                - status
                                - message
                                - symbol
                                - currentPrice
                                - timestamp

                            SniperScanResponse:
                              type: object
                              properties:
                                coins:
                                  type: array
                                  items:
                                    $ref: "#/components/schemas/SniperResult"
                                fetchedAt:
                                  type: number
                              required:
                                - coins
                                - fetchedAt

                            # ─── Menu 4 — Scalping ──────────────────────────────────────────────────
                            ScalpingOB5M:
                              type: object
                              properties:
                                low:
                                  type: number
                                high:
                                  type: number
                                mid:
                                  type: number
                                fresh:
                                  type: boolean
                              required:
                                - low
                                - high
                                - mid
                                - fresh

                            ScalpingResult:
                              type: object
                              properties:
                                status:
                                  type: string
                                  enum: [waiting, approaching, in_zone, expired, no_setup, no_structure, skip, error]
                                symbol:
                                  type: string
                                recentPerformance:
                                  $ref: "#/components/schemas/RecentPerformance"
                                tfBreakdown:
                                  type: array
                                  items:
                                    $ref: "#/components/schemas/TFBreakdownItem"
                                bias:
                                  type: string
                                  enum: [bullish, bearish]
                                currentPrice:
                                  type: number
                                timestamp:
                                  type: string
                                message:
                                  type: string
                                score:
                                  type: number
                                maxScore:
                                  type: number
                                structure15M:
                                  type: string
                                choch15M:
                                  type: boolean
                                ob5M:
                                  $ref: "#/components/schemas/ScalpingOB5M"
                                entryPrice:
                                  type: number
                                stopLoss:
                                  type: number
                                takeProfit1:
                                  type: number
                                takeProfit2:
                                  type: number
                                rr1:
                                  type: number
                                rr2:
                                  type: number
                                atr15MPct:
                                  type: number
                                spreadEstPct:
                                  type: number
                                filterResults:
                                  type: array
                                  items:
                                    type: string
                                bbSqueezing:
                                  type: boolean
                              required:
                                - status
                                - symbol
                                - currentPrice
                                - timestamp
                                - maxScore

                            ScalpingScanResponse:
                              type: object
                              properties:
                                coins:
                                  type: array
                                  items:
                                    $ref: "#/components/schemas/ScalpingResult"
                                fetchedAt:
                                  type: number
                              required:
                                - coins
                                - fetchedAt

                            # ─── Extreme Scalping (H1 → M15 → M5) ──────────────────────────────────
                            ExtremeScalpingResult:
                              type: object
                              properties:
                                status:
                                  type: string
                                  enum: [waiting, approaching, in_zone, expired, no_setup, no_structure, skip, error]
                                symbol:
                                  type: string
                                recentPerformance:
                                  $ref: "#/components/schemas/RecentPerformance"
                                tfBreakdown:
                                  type: array
                                  items:
                                    $ref: "#/components/schemas/TFBreakdownItem"
                                bias:
                                  type: string
                                  enum: [bullish, bearish]
                                isReversalSetup:
                                  type: boolean
                                currentPrice:
                                  type: number
                                timestamp:
                                  type: string
                                message:
                                  type: string
                                score:
                                  type: number
                                maxScore:
                                  type: number
                                structureH1:
                                  type: string
                                chochH1:
                                  type: boolean
                                ob5M:
                                  $ref: "#/components/schemas/ScalpingOB5M"
                                entryPrice:
                                  type: number
                                stopLoss:
                                  type: number
                                takeProfit1:
                                  type: number
                                takeProfit2:
                                  type: number
                                rr1:
                                  type: number
                                rr2:
                                  type: number
                                atr5MPct:
                                  type: number
                                filterResults:
                                  type: array
                                  items:
                                    type: string
                              required:
                                - status
                                - symbol
                                - currentPrice
                                - timestamp
                                - maxScore

                            ExtremeScalpingScanResponse:
                              type: object
                              properties:
                                coins:
                                  type: array
                                  items:
                                    $ref: "#/components/schemas/ExtremeScalpingResult"
                                fetchedAt:
                                  type: number
                              required:
                                - coins
                                - fetchedAt

                            # ─── Menu 5 — Patterns ──────────────────────────────────────────────────
                            PatternResult:
                              type: object
                              properties:
                                name:
                                  type: string
                                category:
                                  type: string
                                  enum: [continuation, reversal]
                                direction:
                                  type: string
                                  enum: [bullish, bearish]
                                confidence:
                                  type: string
                                  enum: [high, medium, low]
                                description:
                                  type: string
                              required:
                                - name
                                - category
                                - direction
                                - confidence
                                - description

                            TFPatterns:
                              type: object
                              properties:
                                tf:
                                  type: string
                                patterns:
                                  type: array
                                  items:
                                    $ref: "#/components/schemas/PatternResult"
                              required:
                                - tf
                                - patterns

                            PatternsResponse:
                              type: object
                              properties:
                                symbol:
                                  type: string
                                timestamp:
                                  type: string
                                timeframes:
                                  type: array
                                  items:
                                    $ref: "#/components/schemas/TFPatterns"
                              required:
                                - symbol
                                - timestamp
                                - timeframes

                            # ─── Menu 6 — Backtest ──────────────────────────────────────────────────
                            ListingInfo:
                              type: object
                              properties:
                                symbol:
                                  type: string
                                listingTimestamp:
                                  type: number
                                listingDate:
                                  type: string
                                diffDays:
                                  type: number
                                diffMonths:
                                  type: number
                                diffYears:
                                  type: number
                                h1Candles:
                                  type: number
                                ageLabel:
                                  type: string
                              required:
                                - symbol
                                - listingTimestamp
                                - listingDate
                                - diffDays
                                - diffMonths
                                - diffYears
                                - h1Candles
                                - ageLabel

                            BacktestRequest:
                              type: object
                              properties:
                                symbol:
                                  type: string
                                period:
                                  type: string
                                  enum: ["1m", "3m", "6m", "1y", "2y", "3y"]
                                menu:
                                  type: string
                                  enum: [sniper, breakout, scalping, extreme_scalping, breakout_entry, both]
                              required:
                                - symbol
